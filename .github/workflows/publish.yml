name: Publish Node

env:
  DEBUG: napi:*
  APP_NAME: guardrail
  MACOSX_DEPLOYMENT_TARGET: '10.13'

'on':
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/guardrail-napi

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm exec napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm exec napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: macos-26
            target: x86_64-apple-darwin
            build: pnpm exec napi build --platform --release --target x86_64-apple-darwin
          - host: macos-26
            target: aarch64-apple-darwin
            build: pnpm exec napi build --platform --release --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm exec napi build --platform --release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm exec napi build --platform --release --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/guardrail-napi/pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/guardrail-napi/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/guardrail-napi/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: crates/guardrail-napi
          merge-multiple: true
      - name: Verify native artifacts
        run: |
          node_count="$(find . -maxdepth 1 -type f -name "${APP_NAME}.*.node" | wc -l | tr -d ' ')"
          test "$node_count" = "6"
      - name: Create platform package directories
        run: pnpm create-npm-dirs
      - name: Move artifacts into platform packages
        run: pnpm artifacts
      - name: Verify platform package directories
        run: |
          package_count="$(find npm -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$package_count" = "6"
      - name: Publish main package
        run: pnpm publish --access public --no-git-checks
      - name: Publish platform packages
        run: |
          for package_dir in npm/*; do
            [ -d "$package_dir" ] || continue
            (cd "$package_dir" && pnpm publish --access public --no-git-checks)
          done
