[workspace]
resolver = "3"
members = [
  "crates/guardrail",
  "crates/guardrail-core",
  "crates/guardrail-linux",
  "crates/guardrail-macos",
  "crates/guardrail-napi",
  "crates/guardrail-windows",
]
default-members = [
  "crates/guardrail",
  "crates/guardrail-core",
  "crates/guardrail-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/OpticLM/guardrail"
license = "Apache-2.0"

[workspace.dependencies]
guardrail = { path = "crates/guardrail" }
guardrail-core = { path = "crates/guardrail-core" }
guardrail-linux = { path = "crates/guardrail-linux" }
guardrail-macos = { path = "crates/guardrail-macos" }
guardrail-windows = { path = "crates/guardrail-windows" }
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"
thiserror = "2"
windows-sys = "0.61"

# Release profile for the napi native addon (small binary, stripped symbols).
# Workspace-wide; applies to all crates but is most relevant to guardrail-napi.
[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
