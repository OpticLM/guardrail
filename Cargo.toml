[workspace]
resolver = "3"
members = ["crates/guardrail-core", "crates/guardrail-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OpticLM/guardrail"

[workspace.dependencies]
thiserror = "2"
guardrail-core = { path = "crates/guardrail-core" }
libc = "0.2"
landlock = "0.4"
seccompiler = "0.5"
