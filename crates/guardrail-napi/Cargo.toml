[package]
name = "guardrail-napi"
version.workspace = true
edition.workspace = true
description = "Node-API (napi-rs) bindings for the guardrail sandbox."
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guardrail.workspace = true
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
