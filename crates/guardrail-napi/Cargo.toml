[package]
name = "guardrail-napi"
description = "Node-API (napi-rs) bindings for the guardrail sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guardrail-core.workspace = true
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[target.'cfg(target_os = "linux")'.dependencies]
guardrail-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
guardrail-macos.workspace = true

[target.'cfg(windows)'.dependencies]
guardrail-windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
napi-build = "2"
