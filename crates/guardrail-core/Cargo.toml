[dependencies]
thiserror.workspace = true

# `libc::sigaction` verifies that child status stays waitable, `libc::waitid`
# preserves it until `SharedSandboxChild` can reap under the kill mutex, and
# `libc::kill` signals it while that wait is in flight. Other platforms reject
# kill-during-wait instead.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true
