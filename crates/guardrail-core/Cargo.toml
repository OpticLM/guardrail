[package]
name = "guardrail-core"
description = "Core interfaces for the guardrail sandbox: policies, builder, and the platform Backend trait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

# `libc::kill` is the only OS-specific call in this crate: it backs the
# kill-during-wait fallback in `SharedSandboxChild` on Unix. Core is otherwise
# platform-agnostic.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
